<html lang="fr" dir="ltr">
<head>

<link rel="icon" href="icon-192.png">

<title>Parcelle 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--k:1.2;--bg:#0f1714;--panel:rgba(14,21,18,.9);--ink:#eef3ee;--mute:#9fb0a6;--acc:#e8b04a;--red:#ff5a4f;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
header{position:fixed;top:0;left:0;right:0;padding:10px 14px 22px;background:linear-gradient(rgba(15,23,20,.85),transparent);pointer-events:none}
header h1{font-size:calc(15px*var(--k));font-weight:700}
header p{font-size:calc(11px*var(--k));color:#cfe0d6;margin-top:2px}
.card{position:fixed;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px}
#info{top:62px;right:10px;padding:9px 12px;font-size:calc(11.5px*var(--k));line-height:1.75;max-width:230px}
#info b{color:var(--acc);font-weight:600}
#info .t{font-weight:700;font-size:calc(12.5px*var(--k));display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
#info hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#sum{cursor:pointer;color:var(--acc);font-size:calc(12px*var(--k));font-weight:600}
#pick{top:62px;left:10px;padding:7px 10px;font-size:calc(11.5px*var(--k));direction:ltr;text-align:left;line-height:1.55;display:none}
#pick b{color:var(--acc)}
#comp{position:fixed;left:14px;width:44px;height:44px;pointer-events:none}
#attr{position:fixed;left:64px;font-size:calc(9px*var(--k));color:#fff;text-shadow:0 0 3px #000;direction:ltr;pointer-events:none}
#bar{bottom:10px;left:10px;right:10px;padding:8px;display:flex;flex-direction:column;gap:8px;max-height:58vh}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:0 0 auto}
.row::-webkit-scrollbar{display:none}
#tabs{border-bottom:1px solid var(--line);padding-bottom:8px;flex-wrap:wrap}#months{flex-wrap:wrap;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}#months button{padding:5px 0}
#tabs button{border-radius:10px;padding:5px 10px}
button{flex:0 0 auto;font:inherit;font-size:calc(12px*var(--k));color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button.on{background:var(--acc);color:#1b1406;border-color:var(--acc);font-weight:600}
button.ghost{background:transparent}
#pane{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.sl{display:flex;align-items:center;gap:8px;font-size:calc(11.5px*var(--k));color:var(--mute);padding:0 4px}
.sl input[type=range]{flex:1;accent-color:var(--acc)}
.sl output{color:var(--ink);min-width:44px;text-align:left;direction:ltr}
.hint{font-size:calc(11px*var(--k));color:var(--mute);padding:0 4px;line-height:1.6}
.res{font-size:calc(12px*var(--k));line-height:1.8;padding:2px 4px}
.res b{color:var(--acc);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.legend{display:flex;flex-direction:column;gap:3px;font-size:calc(11.5px*var(--k));padding:0 4px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .bar{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.legend .bar i{display:block;height:100%}
.legend .sw{width:14px;height:10px;border-radius:2px;flex:0 0 auto}
.legend .pc{direction:ltr;min-width:40px;text-align:left;color:var(--ink)}
input.num{font:inherit;font-size:calc(12px*var(--k));width:80px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 6px;direction:ltr;text-align:center}
table{border-collapse:collapse;width:100%;font-size:calc(11px*var(--k));direction:ltr}
th,td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:#141d19}
td:first-child,th:first-child{text-align:left;color:var(--acc)}
td a{color:#8fd1ff;text-decoration:none}
.tw{direction:ltr;overflow:auto;max-height:30vh;border:1px solid var(--line);border-radius:8px}
#prof{width:100%;height:120px;display:block}
a.btn{flex:0 0 auto;font-size:calc(12px*var(--k));color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none;white-space:nowrap}a.btn.main{background:#1a73e8;border-color:#1a73e8;color:#fff;font-weight:600}
#situ{width:100%;border-radius:10px;display:block;background:#000}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--acc);color:#1b1406;font-size:calc(12px*var(--k));font-weight:600;padding:6px 14px;border-radius:999px;display:none;z-index:60}
@media (min-width:760px){#bar{right:auto;width:480px}#comp{left:auto!important;right:18px}#attr{left:auto!important;right:70px}#info{max-width:260px;font-size:calc(12.5px*var(--k))}}
#impBtn{position:fixed;top:12px;right:12px;z-index:5;display:flex;align-items:center;gap:6px;background:rgba(14,21,18,.9);border:1px solid var(--line);padding:7px 11px}
#impBtn span{font-size:calc(12px*var(--k))}
@media (max-width:480px){#impBtn span{display:none}header{padding-right:60px}}
#info{top:58px}
#imp{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#imp[hidden]{display:none}
.mbox{background:#131c18;border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
@media (min-width:760px){#imp{align-items:center}.mbox{border-radius:16px}}
.mhead{display:flex;justify-content:space-between;align-items:center;font-size:calc(14px*var(--k))}
.msec{display:flex;flex-direction:column;gap:6px}.msec[hidden]{display:none}
.lab{font-size:calc(11px*var(--k));color:var(--mute)}
textarea,.txt{font:inherit;font-size:calc(12px*var(--k));width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 8px}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:calc(11px*var(--k))}
input[type=file]{font-size:calc(12px*var(--k));color:var(--mute)}
select.txt option{background:#131c18}
.pl{display:flex;align-items:center;gap:8px;font-size:calc(12px*var(--k));padding:4px 2px;border-bottom:1px solid var(--line)}
.pl input{accent-color:var(--acc)}
.pl small{color:var(--mute)}
.err{color:#ff8a80}
button.cam{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:12px;background:#1a73e8;border-color:#1a73e8;color:#fff;font-weight:600;font-size:calc(13px*var(--k))}

#scan{position:fixed;inset:0;z-index:30;background:#0f1714;display:flex;flex-direction:column}
#scan[hidden]{display:none}
.sbar{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:calc(13px*var(--k));border-bottom:1px solid var(--line)}
.sview{position:relative;flex:1;min-height:0}
#scCv{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#scPop{position:absolute;left:10px;right:10px;top:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:460px;margin:auto;background:#131c18;border:1px solid var(--acc);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
#scPop[hidden]{display:none}
#scPanel{padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);max-height:42vh;overflow:auto}
button:disabled{opacity:.4}
button.ghost.on{background:var(--acc);color:#1b1406}

header{padding-top:calc(10px + env(safe-area-inset-top))}
#impBtn{top:calc(12px + env(safe-area-inset-top))}
#info{top:calc(58px + env(safe-area-inset-top))}
#pick{top:calc(62px + env(safe-area-inset-top))}
#bar{bottom:calc(10px + env(safe-area-inset-bottom))}
.sbar{padding-top:calc(10px + env(safe-area-inset-top))}
#scPanel{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.mbox{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
#update{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;display:none}
</style>
</head>

<canvas id="c"></canvas>
<header><h1>Propriété « CHOSTAGNER » – Vue 3D</h1><p>Douar El Haret · Commune Mzefroune</p></header>
<div id="info" class="card"></div>
<div id="pick" class="card"></div>
<div class="toast" id="toast"></div>
<svg id="comp" viewBox="-22 -22 44 44"><g id="needle"><polygon points="0,-17 5,0 0,3 -5,0" fill="#ff5a4f"/><polygon points="0,17 5,0 0,3 -5,0" fill="#cfd8d2"/><text x="0" y="-18" fill="#fff" font-size="8" text-anchor="middle" font-family="sans-serif">N</text></g></svg>
<div id="attr">Imagery © Esri, Maxar, Earthstar Geographics</div>
<div id="bar" class="card">
  <div class="row" id="tabs">
    <button data-t="view" class="on">Vue</button>
    <button data-t="situ">Situation</button>
    <button data-t="measure">Mesure</button>
    <button data-t="profile">Profil</button>
    <button data-t="slope">Pentes</button>
    <button data-t="cut">Terrassement</button>
    <button data-t="bornes">Bornes</button>
    <button data-t="sun">Soleil</button>
  </div>
  <div id="pane"></div>
</div>
<button id="impBtn" title="Importer un plan"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v6M9 14l3-3 3 3"/></svg><span>Importer</span></button>
<div id="imp" hidden><div class="mbox">
 <div class="mhead"><b>Importer un autre plan</b><button class="ghost" id="impX">✕</button></div>
 <div class="row" id="srcTabs"><button data-src="dxf" class="on">Fichier DXF</button><button data-src="txt">Points & bornes (CSV / TXT)</button><button id="srcScan">Plan scanné (image / PDF)</button></div>
 <button id="camBtn" class="cam"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>Scanner le plan avec le téléphone</button>
 <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
 <div id="srcDxf" class="msec">
  <label class="lab">Fichier DXF du géomètre (AutoCAD, Covadis…)</label>
  <input type="file" id="dxfFile" accept=".dxf">
  <div id="dxfInfo" class="hint"></div>
  <div id="dxfPolys"></div>
 </div>
 <div id="srcTxt" class="msec" hidden>
  <label class="lab">Points topographiques — X Y Z (fichier ou collage)</label>
  <input type="file" id="ptsFile" accept=".csv,.txt,.xyz">
  <textarea id="ptsTxt" rows="4" placeholder="464899.42;468376.61;225.30&#10;464935.34;468402.61;212.10&#10;…"></textarea>
  <label class="lab">Bornes de la parcelle — Nom X Y (une par ligne, « # Nom » pour une autre parcelle)</label>
  <input type="file" id="bFile" accept=".csv,.txt">
  <textarea id="bTxt" rows="4" placeholder="# Titre 12345/30&#10;B1 464899.42 468376.61&#10;B2 464935.34 468402.61&#10;…"></textarea>
 </div>
 <div class="grid2 msec">
  <div><label class="lab">Nom du projet</label><input id="impName" class="txt" placeholder="Ex. Titre 12345/30"></div>
  <div><label class="lab">Système de coordonnées</label><select id="impProj" class="txt">
   <option value="26191">Lambert Nord Maroc (zone 1)</option><option value="26192">Lambert Sud Maroc (zone 2)</option>
   <option value="26194">Lambert Sahara Nord (zone 3)</option><option value="26195">Lambert Sahara Sud (zone 4)</option></select></div>
 </div>
 <div id="impMsg" class="res"></div>
 <div class="row"><button id="impGo" class="on">Construire la 3D</button><button id="impLast" hidden>Dernier plan importé</button><span style="flex:1"></span><button id="impReset" class="ghost">Plan d’origine</button></div>
 <div class="hint">Plan scanné (PDF, photo) : bouton « Plan scanné » — calage et saisie guidés. Pour un plan importé, l’image satellite n’est pas disponible.</div>
</div></div>
<div id="scan" hidden>
 <div class="sbar"><b id="scStep">1/4</b><span style="flex:1"></span><button class="ghost" id="scRot" title="Pivoter le plan">⟳ 90°</button><button class="ghost" id="scCon">Contraste</button><button class="ghost" id="scFitB" title="Recentrer">⤢</button><button class="ghost" id="scClose">✕ Quitter</button></div>
 <div class="sview"><canvas id="scCv"></canvas><div id="scPop" hidden></div></div>
 <div id="scPanel"></div>
</div>

{const c=document.createElement('canvas');c.width=2;c.height=256;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#5e9fe0');gr.addColorStop(1,'#e6f2fb');g.fillStyle=gr;g.fillRect(0,0,2,256);const bt=new THREE.CanvasTexture(c);bt.colorSpace=THREE.SRGBColorSpace;scene.background=bt;}

function zAt(X,Y){const fx=(X-D.x0)/D.step,fy=(Y-D.y0)/D.step;
 const i=Math.max(0,Math.min(D.nx-2,Math.floor(fx))),j=Math.max(0,Math.min(D.ny-2,Math.floor(fy)));
 const tx=Math.min(1,Math.max(0,fx-i)),ty=Math.min(1,Math.max(0,fy-j)),g=(a,b)=>zs[b*D.nx+a];
 return (g(i,j)*(1-tx)+g(i+1,j)*tx)*(1-ty)+(g(i,j+1)*(1-tx)+g(i+1,j+1)*tx)*ty;}
const inDEM=(X,Y)=>X>=D.x0&&X<=XMAX&&Y>=D.y0&&Y<=YMAX;
function pip(X,Y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const [xi,yi]=P[i],[xj,yj]=P[j];if(((yi>Y)!=(yj>Y))&&(X<(xj-xi)*(Y-yi)/(yj-yi)+xi))c=!c;}return c;}
function polyArea(P){let a=0;for(let i=0;i<P.length;i++){const [x1,y1]=P[i],[x2,y2]=P[(i+1)%P.length];a+=x1*y2-x2*y1;}return Math.abs(a)/2;}
function haFmt(m2){const ha=Math.floor(m2/10000),a=Math.floor((m2-ha*10000)/100),ca=Math.round(m2-ha*10000-a*100);return `${ha} Ha ${a} A ${ca} Ca`;}

const G=new THREE.Group();scene.add(G);
const unsq=[]; // objects that must not be squashed by EX
const labels=[];

// ---------- terrain ----------
const geo=new THREE.BufferGeometry();const pos=[],colHyp=[],idx=[],uv=[];
const ramp=[[0,[0.22,0.40,0.28]],[0.3,[0.47,0.58,0.32]],[0.55,[0.74,0.68,0.42]],[0.8,[0.66,0.50,0.34]],[1,[0.90,0.86,0.80]]];
function rc(t){for(let k=1;k<ramp.length;k++){if(t<=ramp[k][0]){const a=ramp[k-1],b=ramp[k],u=(t-a[0])/(b[0]-a[0]);return a[1].map((v,i)=>v+(b[1][i]-v)*u);}}return ramp[ramp.length-1][1];}
const slopeAt=new Float32Array(D.nx*D.ny);
for(let j=0;j<D.ny;j++)for(let i=0;i<D.nx;i++){

 pos.push(x,z-ZMIN,y);uv.push(i/(D.nx-1),j/(D.ny-1));colHyp.push(...rc((z-ZMIN)/(ZMAX-ZMIN)));
 const g=(a,b)=>zs[Math.max(0,Math.min(D.ny-1,b))*D.nx+Math.max(0,Math.min(D.nx-1,a))];
 const dx=(g(i+1,j)-g(i-1,j))/(((i>0&&i<D.nx-1)?2:1)*D.step),dy=(g(i,j+1)-g(i,j-1))/(((j>0&&j<D.ny-1)?2:1)*D.step);
 slopeAt[j*D.nx+i]=Math.hypot(dx,dy)*100;}
for(let j=0;j<D.ny-1;j++)for(let i=0;i<D.nx-1;i++){const a=j*D.nx+i,b=a+1,c=a+D.nx,d=c+1;idx.push(a,c,b,b,c,d);}
const SLC=[[5,'#1a9850','0 – 5%','Plat'],[10,'#91cf60','5 – 10%','Faible'],[15,'#d9ef8b','10 – 15%','Modérée'],[25,'#fee08b','15 – 25%','Forte'],[35,'#fc8d59','25 – 35%','Très forte'],[1e9,'#d73027','> 35%','Raide']];
const slCls=s=>SLC.findIndex(c=>s<c[0]);
const colSlope=[];{const tmp=new THREE.Color();for(let k=0;k<slopeAt.length;k++){tmp.set(SLC[slCls(slopeAt[k])][1]);colSlope.push(tmp.r,tmp.g,tmp.b);}}
const lin=a=>{const c=new THREE.Color();const o=[];for(let k=0;k<a.length;k+=3){c.setRGB(a[k],a[k+1],a[k+2]);o.push(c.r,c.g,c.b);}return o;};

function setTerrain(mode){ // 'sat' | 'hyp' | 'slope'
 if(mode==='sat'&&TEX.length){terrain.material=(TEX[S.tex]||TEX[0]).mat;}
 else{geo.setAttribute('color',mode==='slope'?colSlopeA:colHypA);terrain.material=matCol;matCol.needsUpdate=true;}}
// skirt
{const base=-8,sk=[],edge=[];

 for(let k=0;k<edge.length-1;k++){const p=edge[k],q=edge[k+1];const P=(e,top)=>{const X=D.x0+e[0]*D.step,Y=D.y0+e[1]*D.step,[x,y]=W(X,Y);return [x,top?zs[e[1]*D.nx+e[0]]-ZMIN:base,y]};
  sk.push(...P(p,1),...P(p,0),...P(q,1),...P(q,1),...P(p,0),...P(q,0));}

const lineMats=[];

function drapePts(XY,off=0.4,step=1.5,clip=true){const out=[];

function sunPos(month,hour){ // returns {az,el} deg, local time UTC+1
 const lat=D.center_gps[0]*Math.PI/180,lon=D.center_gps[1];
 const doy=Math.round((month-1)*30.44+15);const g=2*Math.PI/365*(doy-1+(hour-1-12)/24);
 const eqt=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
 const decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
 const tst=(hour-1)*60+eqt+4*lon;const ha=(tst/4-180)*Math.PI/180;
 const cz=Math.sin(lat)*Math.sin(decl)+Math.cos(lat)*Math.cos(decl)*Math.cos(ha);const zen=Math.acos(Math.max(-1,Math.min(1,cz)));
 let az=Math.acos(Math.max(-1,Math.min(1,(Math.sin(lat)*Math.cos(zen)-Math.sin(decl))/(Math.cos(lat)*Math.sin(zen)))));az=ha>0?(az*180/Math.PI+180)%360:(540-az*180/Math.PI)%360;
 return {az,el:90-zen*180/Math.PI};}

const MONTHS_L=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const hhmm=h=>{const H=Math.floor(h),m=Math.round((h-H)*60);return `${String(H+(m===60?1:0)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;};
function sunTimes(month){let rise=null,set=null,prev=sunPos(month,4).el;for(let h=4.05;h<=22;h+=0.05){const e=sunPos(month,h).el;if(prev<0&&e>=0)rise=h;if(prev>=0&&e<0)set=h;prev=e;}let noon=12,mx=-90;for(let h=10;h<=16;h+=0.05){const e=sunPos(month,h).el;if(e>mx){mx=e;noon=h;}}return {rise,set,noon,mx};}

// ---- text parsing ----
function tokens(line){line=line.trim();if(!line)return [];
 if(/[;\t]/.test(line))return line.split(/[;\t]+/).map(s=>s.trim().replace(/\s/g,'').replace(',','.'));
 return line.split(/[\s,]+/);}
const isNum=s=>/^[-+]?\d+(\.\d+)?$/.test(s);
function parsePoints(txt){const out=[];for(const line of txt.split(/\r?\n/)){const tk=tokens(line);const nums=tk.filter(isNum).map(Number);
 if(nums.length<3)continue;let a=nums;if(nums.length>=4&&Math.abs(nums[0])<100000&&Number.isInteger(nums[0]))a=nums.slice(1);
 const [X,Y,Z]=a;if(Math.abs(X)>1000&&Math.abs(Y)>1000&&isFinite(Z))out.push([X,Y,Z]);}return out;}
function parseBornes(txt){const parcels=[];let cur=null;
 for(const raw of txt.split(/\r?\n/)){const line=raw.trim();if(!line)continue;
  if(line.startsWith('#')){cur={name:line.replace(/^#+/,'').trim()||`Parcelle ${parcels.length+1}`,pts:[]};parcels.push(cur);continue;}
  const tk=tokens(line);const nums=tk.filter(isNum).map(Number).filter(v=>Math.abs(v)>1000);if(nums.length<2)continue;
  let nm=tk.find(s=>!isNum(s));if(!nm&&tk.length>=3&&/^\d{1,4}$/.test(tk[0]))nm=tk[0];if(!cur){cur={name:`Parcelle ${parcels.length+1}`,pts:[]};parcels.push(cur);}
  cur.pts.push([nm||`S${cur.pts.length+1}`,nums[0],nums[1]]);}
 return parcels.filter(p=>p.pts.length>=3);}

// ---- DXF ----
q('#dxfFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;q('#dxfInfo').textContent='Lecture du fichier…';q('#dxfPolys').innerHTML='';
 try{await loadLib(LIBS.dxf);const txt=await readFile(f);const P=window.DxfParser.default?new window.DxfParser.default():new window.DxfParser();
  DXF=analyseDxf(P.parseSync(txt));if(!q('#impName').value)q('#impName').value=f.name.replace(/\.dxf$/i,'');
  const ps=DXF.polys;
  q('#dxfInfo').innerHTML=`<b>${DXF.z.length}</b> points avec altitude${DXF.fromText?' (lus depuis les textes de cotes)':''} · <b>${ps.length}</b> polylignes fermées. Cochez la ou les parcelles :`;
  q('#dxfPolys').innerHTML=ps.length?ps.map((p,i)=>`<label class="pl"><input type="checkbox" data-i="${i}" ${p.def?'checked':''}><span>Calque <b>${p.layer}</b></span><small>${fmtA(p.area)} · ${p.pts.length} sommets</small></label>`).join(''):'<div class="hint err">Aucune polyligne fermée : la 3D sera construite sans limite de parcelle.</div>';
 }catch(err){q('#dxfInfo').innerHTML=`<span class="err">Erreur de lecture : ${err.message}</span>`;}};
const fmtA=m2=>m2>=10000?(m2/10000).toFixed(2)+' ha':Math.round(m2)+' m²';
function pArea(P){let a=0;for(let i=0;i<P.length;i++){const [x1,y1]=P[i],[x2,y2]=P[(i+1)%P.length];a+=x1*y2-x2*y1;}return Math.abs(a)/2;}
function analyseDxf(dxf){const z=[],texts=[],nums=[],polys=[];
 const add=(p)=>{if(p&&isFinite(p.z)&&Math.abs(p.z)>1e-6&&Math.abs(p.x)>1000)z.push([p.x,p.y,p.z]);};
 for(const e of dxf.entities||[]){const L=e.layer||'0';
  switch(e.type){
   case 'POINT':case 'INSERT':add(e.position);break;
   case 'LINE':(e.vertices||[]).forEach(add);break;
   case '3DFACE':(e.vertices||[]).forEach(add);break;
   case 'TEXT':case 'MTEXT':{const p=e.startPoint||e.position;if(!p)break;const s=String(e.text||'').replace(/\\[A-Za-z][^;]*;|[{}]/g,'').trim();
    if(/^[-+]?\d+[.,]\d{1,3}$/.test(s))nums.push([p.x,p.y,parseFloat(s.replace(',','.'))]);else if(s.length&&s.length<=10)texts.push([p.x,p.y,s]);break;}
   case 'LWPOLYLINE':case 'POLYLINE':{const v=e.vertices||[];if(v.length<2)break;const el=e.elevation??v[0].z??0;
    const zs=v.map(p=>p.z??el);const flat=zs.every(k=>Math.abs(k-zs[0])<1e-6);
    const first=v[0],last=v[v.length-1];const closed=!!(e.shape||e.closed)||(Math.hypot(first.x-last.x,first.y-last.y)<0.01&&v.length>3);
    if(Math.abs(zs[0])>1e-6||!flat){ // contour or 3D polyline -> sample
     for(let i=0;i<v.length-(closed?0:1);i++){const a=v[i],b=v[(i+1)%v.length];const n=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/3));for(let s=0;s<n;s++){const t=s/n;add({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:(a.z??el)+((b.z??el)-(a.z??el))*t});}}}
    if(closed&&flat){let pts=v.map(p=>[p.x,p.y]);if(Math.hypot(pts[0][0]-pts.at(-1)[0],pts[0][1]-pts.at(-1)[1])<0.01)pts.pop();const area=pArea(pts);
     if(area>20&&Math.abs(pts[0][0])>1000)polys.push({layer:L,pts,area,z:zs[0]});}
    break;}
  }}
 let fromText=false,Z=z;
 if(z.length<5&&nums.length>=5){const med=nums.map(n=>n[2]).sort((a,b)=>a-b)[nums.length>>1];Z=nums.filter(n=>Math.abs(n[2]-med)<300);fromText=true;}
 // keep likely parcel polygons: not contours (contours have z≠0 usually)
 let P=polys.filter(p=>Math.abs(p.z)<1e-6||/lim|parc|titre|born|propr|cadast/i.test(p.layer));if(!P.length)P=polys;
 P.sort((a,b)=>b.area-a.area);P=P.slice(0,15);
 const pref=P.filter(p=>/lim|parc|titre|born|propr|cadast/i.test(p.layer));(pref.length?pref:P.slice(0,1)).forEach(p=>p.def=true);
 // name vertices from nearby short texts
 for(const p of P){p.names=p.pts.map((v,i)=>{let best=null,bd=6;for(const t of texts){const d=Math.hypot(t[0]-v[0],t[1]-v[1]);if(d<bd&&/^[A-Za-z]{0,3}\d{1,4}[A-Za-z]?$/.test(t[2])){bd=d;best=t[2];}}return best||`S${i+1}`;});}
 return {z:Z,polys:P,fromText};}

// ---- interpolation ----
function tps(pts,lambda){const n=pts.length;let mx=0,my=0;pts.forEach(p=>{mx+=p[0];my+=p[1]});mx/=n;my/=n;
 const P=pts.map(p=>[p[0]-mx,p[1]-my,p[2]]);const N=n+3;const A=Array.from({length:N},()=>new Float64Array(N+1));
 const U=r=>r>0?r*r*Math.log(r):0;
 for(let i=0;i<n;i++){for(let j=0;j<n;j++)A[i][j]=i===j?lambda:U(Math.hypot(P[i][0]-P[j][0],P[i][1]-P[j][1]));A[i][n]=1;A[i][n+1]=P[i][0];A[i][n+2]=P[i][1];A[i][N]=P[i][2];
  A[n][i]=1;A[n+1][i]=P[i][0];A[n+2][i]=P[i][1];}
 for(let c=0;c<N;c++){let piv=c;for(let r=c+1;r<N;r++)if(Math.abs(A[r][c])>Math.abs(A[piv][c]))piv=r;[A[c],A[piv]]=[A[piv],A[c]];const d=A[c][c];if(Math.abs(d)<1e-12)continue;
  for(let r=0;r<N;r++){if(r===c)continue;const f=A[r][c]/d;if(f===0)continue;const Ar=A[r],Ac=A[c];for(let k=c;k<=N;k++)Ar[k]-=f*Ac[k];}}
 const w=A.map((row,i)=>Math.abs(row[i])<1e-12?0:row[N]/row[i]);
 return (X,Y)=>{const x=X-mx,y=Y-my;let s=w[n]+w[n+1]*x+w[n+2]*y;for(let i=0;i<n;i++)s+=w[i]*U(Math.hypot(x-P[i][0],y-P[i][1]));return s;};}
async function gridZ(spots,x0,y0,nx,ny,st){const z=new Float32Array(nx*ny);
 if(spots.length<3){const v=spots.length?spots.reduce((a,p)=>a+p[2],0)/spots.length:0;z.fill(v);return z;}
 if(spots.length<=500){const f=tps(spots,2);for(let j=0;j<ny;j++)for(let i=0;i<nx;i++)z[j*nx+i]=f(x0+i*st,y0+j*st);}
 else{await loadLib(LIBS.del);const co=new Float64Array(spots.length*2);spots.forEach((p,i)=>{co[2*i]=p[0];co[2*i+1]=p[1];});const T=new window.Delaunator(co).triangles;
  const filled=new Uint8Array(nx*ny);
  for(let t=0;t<T.length;t+=3){const a=spots[T[t]],b=spots[T[t+1]],c=spots[T[t+2]];
   const i0=Math.max(0,Math.floor((Math.min(a[0],b[0],c[0])-x0)/st)),i1=Math.min(nx-1,Math.ceil((Math.max(a[0],b[0],c[0])-x0)/st));
   const j0=Math.max(0,Math.floor((Math.min(a[1],b[1],c[1])-y0)/st)),j1=Math.min(ny-1,Math.ceil((Math.max(a[1],b[1],c[1])-y0)/st));
   const det=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1]);if(Math.abs(det)<1e-9)continue;
   for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const X=x0+i*st,Y=y0+j*st;const l1=((b[1]-c[1])*(X-c[0])+(c[0]-b[0])*(Y-c[1]))/det,l2=((c[1]-a[1])*(X-c[0])+(a[0]-c[0])*(Y-c[1]))/det,l3=1-l1-l2;
    if(l1>=-1e-6&&l2>=-1e-6&&l3>=-1e-6){z[j*nx+i]=l1*a[2]+l2*b[2]+l3*c[2];filled[j*nx+i]=1;}}}
  const sub=spots.filter((_,i)=>i%Math.ceil(spots.length/800)===0);
  for(let k=0;k<z.length;k++)if(!filled[k]){const X=x0+(k%nx)*st,Y=y0+Math.floor(k/nx)*st;let sw=0,sz=0;for(const p of sub){const d2=(p[0]-X)**2+(p[1]-Y)**2+1;const w=1/d2;sw+=w;sz+=w*p[2];}z[k]=sz/sw;}}
 let mn=Infinity,mx=-Infinity;spots.forEach(p=>{mn=Math.min(mn,p[2]);mx=Math.max(mx,p[2]);});for(let k=0;k<z.length;k++)z[k]=Math.min(mx+3,Math.max(mn-3,z[k]));
 return z;}
function contourSegs(z,x0,y0,nx,ny,st){let mn=Infinity,mx=-Infinity;for(const v of z){mn=Math.min(mn,v);mx=Math.max(mx,v);}const rg=mx-mn;if(rg<0.2)return {segs:[],major:1};
 const iv=[0.25,0.5,1,2,5,10,20,50].find(v=>rg/v<=70)||100;const major=iv*5;const out=new Map();
 for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){const a=z[j*nx+i],b=z[j*nx+i+1],c=z[(j+1)*nx+i+1],d=z[(j+1)*nx+i];const lo=Math.min(a,b,c,d),hi=Math.max(a,b,c,d);
  for(let L=Math.ceil(lo/iv)*iv;L<=hi;L+=iv){const X=x0+i*st,Y=y0+j*st;const pts=[];
   const e=(z1,z2,p1,p2)=>{if((z1<L)!==(z2<L)){const t=(L-z1)/(z2-z1);pts.push([p1[0]+(p2[0]-p1[0])*t,p1[1]+(p2[1]-p1[1])*t]);}};
   const A=[X,Y],B=[X+st,Y],C=[X+st,Y+st],Dd=[X,Y+st];e(a,b,A,B);e(b,c,B,C);e(c,d,C,Dd);e(d,a,Dd,A);
   if(pts.length>=2){const k=+L.toFixed(3);if(!out.has(k))out.set(k,[]);const arr=out.get(k);arr.push(pts[0][0],pts[0][1],pts[1][0],pts[1][1]);if(pts.length===4)arr.push(pts[2][0],pts[2][1],pts[3][0],pts[3][1]);}}}
 return {segs:[...out.entries()],major};}
function pipT(X,Y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const [xi,yi]=P[i],[xj,yj]=P[j];if(((yi>Y)!=(yj>Y))&&(X<(xj-xi)*(Y-yi)/(yj-yi)+xi))c=!c;}return c;}
const haF=m2=>{const ha=Math.floor(m2/10000),a=Math.floor((m2-ha*10000)/100),ca=Math.round(m2-ha*10000-a*100);return `${ha} Ha ${a} A ${ca} Ca`;};


// ================= ONLINE ENRICHMENT (satellite, relief, roads/rivers) =================
const T2LL=(z,x,y)=>[x/2**z*360-180,Math.atan(Math.sinh(Math.PI*(1-2*y/2**z)))*180/Math.PI];
const LL2T=(z,lon,lat)=>[(lon+180)/360*2**z,(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*2**z];
async function tileMosaic(urlFn,z,lonMin,latMin,lonMax,latMax){const [fx0,fy0]=LL2T(z,lonMin,latMax),[fx1,fy1]=LL2T(z,lonMax,latMin);
 const x0=Math.floor(fx0),y0=Math.floor(fy0),x1=Math.floor(fx1),y1=Math.floor(fy1);const nx=x1-x0+1,ny=y1-y0+1;
 const cv=document.createElement('canvas');cv.width=nx*256;cv.height=ny*256;const c=cv.getContext('2d',{willReadFrequently:true});let ok=0;
 await Promise.all([...Array(nx*ny).keys()].map(async k=>{const x=x0+k%nx,y=y0+Math.floor(k/nx);try{const r=await fetch(urlFn(z,x,y));if(!r.ok)return;const im=await createImageBitmap(await r.blob());c.drawImage(im,(x-x0)*256,(y-y0)*256);ok++;}catch(e){}}));
 if(!ok)throw new Error('tuiles indisponibles');return {cv,c,z,x0,y0,nx,ny};}
function pickZoom(lonMin,latMin,lonMax,latMax,zmax,maxTiles){for(let z=zmax;z>=10;z--){const [a,b]=LL2T(z,lonMin,latMax),[c,d]=LL2T(z,lonMax,latMin);if((Math.floor(c)-Math.floor(a)+1)*(Math.floor(d)-Math.floor(b)+1)<=maxTiles)return z;}return 10;}
async function enrich(d,proj,say=()=>{}){const res={};if(!navigator.onLine)return res;
 try{await loadLib(LIBS.proj);}catch(e){return res;}const tr=window.proj4(PROJDEF[proj],'EPSG:4326');
 const X0=d.x0,Y0=d.y0,X1=d.x0+(d.nx-1)*d.step,Y1=d.y0+(d.ny-1)*d.step;
 const cs=[[X0,Y0],[X1,Y0],[X0,Y1],[X1,Y1]].map(p=>tr.forward(p));const lonMin=Math.min(...cs.map(p=>p[0])),lonMax=Math.max(...cs.map(p=>p[0])),latMin=Math.min(...cs.map(p=>p[1])),latMax=Math.max(...cs.map(p=>p[1]));
 // lattice mapping texture/grid -> lon/lat
 const LAT=32;const lat=[];for(let j=0;j<=LAT;j++)for(let i=0;i<=LAT;i++){lat.push(tr.forward([X0+(X1-X0)*i/LAT,Y1-(Y1-Y0)*j/LAT]));}
 const llAt=(u,v)=>{const fi=u*LAT,fj=v*LAT,i=Math.min(LAT-1,Math.floor(fi)),j=Math.min(LAT-1,Math.floor(fj)),a=fi-i,b=fj-j;const g=(ii,jj)=>lat[jj*(LAT+1)+ii];
  const p00=g(i,j),p10=g(i+1,j),p01=g(i,j+1),p11=g(i+1,j+1);return [(p00[0]*(1-a)+p10[0]*a)*(1-b)+(p01[0]*(1-a)+p11[0]*a)*b,(p00[1]*(1-a)+p10[1]*a)*(1-b)+(p01[1]*(1-a)+p11[1]*a)*b];};
 // satellite
 try{say('Image satellite…');const z=pickZoom(lonMin,latMin,lonMax,latMax,18,30);
  const M=await tileMosaic((z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,z,lonMin,latMin,lonMax,latMax);
  const src=M.c.getImageData(0,0,M.cv.width,M.cv.height).data,SW=M.cv.width,SH=M.cv.height;
  const W=Math.min(2048,Math.round((X1-X0)/0.25)),H=Math.max(2,Math.round(W*(Y1-Y0)/(X1-X0)));const out=new ImageData(W,H),od=out.data;
  for(let v=0;v<H;v++)for(let u=0;u<W;u++){const [lo,la]=llAt(u/(W-1),v/(H-1));const [tx,ty]=LL2T(z,lo,la);const px=Math.floor((tx-M.x0)*256),py=Math.floor((ty-M.y0)*256);const o=(v*W+u)*4;
   if(px>=0&&py>=0&&px<SW&&py<SH){const k=(py*SW+px)*4;od[o]=src[k];od[o+1]=src[k+1];od[o+2]=src[k+2];}od[o+3]=255;}
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;cv.getContext('2d').putImageData(out,0,0);res.sat=cv.toDataURL('image/jpeg',0.85);}catch(e){console.warn('sat',e);}
 // relief (only when the plan has no heights)
 if(d.spots.length<3){try{say('Relief (SRTM)…');const z=pickZoom(lonMin,latMin,lonMax,latMax,15,16);
  const M=await tileMosaic((z,x,y)=>`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`,z,lonMin,latMin,lonMax,latMax);
  const src=M.c.getImageData(0,0,M.cv.width,M.cv.height).data,SW=M.cv.width,SH=M.cv.height;
  const el=(px,py)=>{px=Math.max(0,Math.min(SW-1,px));py=Math.max(0,Math.min(SH-1,py));const k=(py*SW+px)*4;return src[k]*256+src[k+1]+src[k+2]/256-32768;};
  const z2=new Float32Array(d.nx*d.ny);let mn=Infinity,mx=-Infinity;
  for(let j=0;j<d.ny;j++)for(let i=0;i<d.nx;i++){const [lo,la]=llAt(i/(d.nx-1),1-j/(d.ny-1));const [tx,ty]=LL2T(z,lo,la);const fx=(tx-M.x0)*256-0.5,fy=(ty-M.y0)*256-0.5;const ix=Math.floor(fx),iy=Math.floor(fy),a=fx-ix,b=fy-iy;

  c.font='600 11px Inter,sans-serif';c.lineWidth=3;c.strokeStyle='#fff';c.strokeText(s.Z.toFixed(2),x+6,y+4);c.fillStyle='#7a4a00';c.fillText(s.Z.toFixed(2),x+6,y+4);}
 // calibration
 SCN.cal.forEach((p,i)=>{const [x,y]=toScr(p.px,p.py);c.strokeStyle='#1565c0';c.lineWidth=2;c.beginPath();c.moveTo(x-12,y);c.lineTo(x+12,y);c.moveTo(x,y-12);c.lineTo(x,y+12);c.stroke();c.beginPath();c.arc(x,y,7,0,7);c.stroke();
  c.font='700 11px Inter,sans-serif';c.fillStyle='#1565c0';c.fillText('C'+(i+1),x+9,y-9);});
 if(SCN.pend){const [x,y]=toScr(SCN.pend[0],SCN.pend[1]);c.strokeStyle='#e91e63';c.lineWidth=2;c.beginPath();c.arc(x,y,9,0,7);c.stroke();}}
{const pts=new Map();let tap=null,pinch=null;
 scCv.addEventListener('pointerdown',e=>{scCv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.offsetX,e.offsetY]);if(pts.size===1)tap={x:e.offsetX,y:e.offsetY,t:performance.now(),ox:SCN.view.ox,oy:SCN.view.oy};
  if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),s:SCN.view.s,m:[(a[0]+b[0])/2,(a[1]+b[1])/2],ox:SCN.view.ox,oy:SCN.view.oy};tap=null;}});
 scCv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.offsetX,e.offsetY]);
  if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const s=Math.max(0.02,Math.min(20,pinch.s*d/pinch.d));const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
   const ix=(pinch.m[0]-pinch.ox)/pinch.s,iy=(pinch.m[1]-pinch.oy)/pinch.s;SCN.view={s,ox:m[0]-ix*s,oy:m[1]-iy*s};scRender();}
  else if(tap&&pts.size===1){const dx=e.offsetX-tap.x,dy=e.offsetY-tap.y;if(Math.hypot(dx,dy)>6)tap.moved=true;if(tap.moved){SCN.view.ox=tap.ox+dx;SCN.view.oy=tap.oy+dy;scRender();}}});
 const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(tap&&!tap.moved&&pts.size===0&&performance.now()-tap.t<600&&SCN.img){scTap(...toImg(e.offsetX,e.offsetY));}if(pts.size===0)tap=null;};
 scCv.addEventListener('pointerup',up);scCv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);tap=null;pinch=null;});
 scCv.addEventListener('wheel',e=>{e.preventDefault();const k=Math.exp(-e.deltaY*0.0015);const s=Math.max(0.02,Math.min(20,SCN.view.s*k));const [ix,iy]=toImg(e.offsetX,e.offsetY);SCN.view={s,ox:e.offsetX-ix*s,oy:e.offsetY-iy*s};scRender();},{passive:false});
 addEventListener('resize',()=>{if(!scan.hidden)scResize();});}
// ---- popup ----
function ask(fields,title){return new Promise(res=>{const p=q('#scPop');p.hidden=false;p.innerHTML=`<div class="lab">${title}</div><div class="row" style="flex-wrap:wrap">${fields.map((f,i)=>`<label class="lab" style="flex:1;min-width:110px">${f.l}<input class="txt" data-i="${i}" inputmode="${f.t==='text'?'text':'decimal'}" value="${f.v??''}"></label>`).join('')}</div><div class="row"><button class="on" id="pOk">OK</button><button id="pNo">Annuler</button></div>`;
 const ins=[...p.querySelectorAll('input')];ins[0].focus();ins[0].select?.();
 const done=v=>{p.hidden=true;SCN.pend=null;scRender();res(v);};
 p.querySelector('#pOk').onclick=()=>{const v=ins.map((x,i)=>fields[i].t==='text'?x.value.trim():parseFloat(x.value.replace(',','.').replace(/\s/g,'')));if(v.some((x,i)=>fields[i].t!=='text'&&!isFinite(x))){toastS('Valeur invalide');return;}done(v);};
 p.querySelector('#pNo').onclick=()=>done(null);ins.forEach(x=>x.onkeydown=e=>{if(e.key==='Enter')p.querySelector('#pOk').click();});});}
// ---- taps by step ----
async function scTap(px,py){if(!q('#scPop').hidden)return;SCN.pend=[px,py];scRender();
 if(SCN.step===2){let sug=['',''];if(SCN.T){const [X,Y]=SCN.T.fw(px,py);sug=[X.toFixed(2),Y.toFixed(2)];}
  const v=await ask([{l:'X',v:sug[0]},{l:'Y',v:sug[1]}],`Point de calage C${SCN.cal.length+1} : coordonnées (croix du quadrillage ou borne connue)`);
  if(v){SCN.cal.push({px,py,X:v[0],Y:v[1]});SCN.T=solveCal(SCN.cal);}scPanelRender();}
 else if(SCN.step===3&&SCN.lmode!=='b'){if(!SCN.T)return;const [X,Y]=SCN.T.fw(px,py);let L=SCN.curLine;if(!L){L=SCN.curLine={type:SCN.lmode,name:SCN.lmode==='water'?'Oued':'Piste',pts:[]};SCN.lines.push(L);}L.pts.push([X,Y]);scPanelRender();}
 else if(SCN.step===3){if(!SCN.T)return;const [X,Y]=SCN.T.fw(px,py);if(!SCN.parcels.length||SCN.parcels.at(-1).fromPaste)SCN.parcels.push({name:`Parcelle ${SCN.parcels.length+1}`,pts:[]});
  const P=SCN.parcels.at(-1);const v=await ask([{l:'Nom de la borne',v:`B${P.pts.length+1}`,t:'text'}],`Borne à X ${X.toFixed(2)} · Y ${Y.toFixed(2)}`);if(v)P.pts.push([v[0]||`B${P.pts.length+1}`,X,Y]);scPanelRender();}
 else if(SCN.step===4){if(!SCN.T)return;const last=SCN.spots.at(-1);const v=await ask([{l:'Altitude Z (m)',v:last?String(Math.round(last.Z)):''}],'Point coté : saisissez la valeur lue sur le plan');
  if(v){const [X,Y]=SCN.T.fw(px,py);SCN.spots.push({px,py,X,Y,Z:v[0]});}scPanelRender();}
 SCN.pend=null;scRender();}
// ---- panel ----
const STEPS=['','Charger le plan','Calage','Bornes','Points cotés'];
function scPanelRender(){q('#scStep').textContent=`${SCN.step}/4 · ${STEPS[SCN.step]}`;const rms=calRms();let h='';
 if(SCN.step===1)h=`<div class="hint">Image (JPG, PNG) ou PDF du plan topographique. Le plan reste sur votre appareil.</div><div class="row"><button id="scCam" class="cam" style="flex:1">📷 Prendre une photo</button></div><label class="lab">ou choisir un fichier (image ou PDF)</label><input type="file" id="scFile" accept="image/*,.pdf"><div class="hint">Photo : posez le plan bien à plat, sans ombre, et cadrez toute la feuille. La perspective sera corrigée avec 4 points de calage.</div><div id="scInfo" class="hint"></div>`;
 if(SCN.step===2)h=`<div class="hint">Zoomez (pincer / molette) puis touchez <b>au moins 2 croix du quadrillage</b> (ou 2 bornes du tableau) et saisissez leurs X, Y. Plan scanné : 2–3 points. <b>Photo : 4 points ou plus</b>, bien répartis aux coins, pour corriger la perspective.</div>
  <div class="res">${SCN.cal.map((p,i)=>`C${i+1} : ${bdS(p.X.toFixed(2)+' ; '+p.Y.toFixed(2))}`).join(' · ')||'Aucun point.'}${SCN.T?` · échelle ${bdS((1/SCN.T.scale).toFixed(2)+' px/m')} · ${SCN.T.proj?'perspective corrigée':SCN.cal.length===2?'similitude':'affine'}`:''}${rms!=null?` · écart moyen <b>${bdS(rms.toFixed(2)+' m')}</b>`:''}</div>
  <div class="row"><button id="scUndo">↶ Annuler le dernier</button><span style="flex:1"></span><button id="scNext" class="on" ${SCN.T?'':'disabled'}>Suivant</button></div>`;
 if(SCN.step===3)h=`<div class="hint">Collez le tableau des bornes du plan (Nom X Y, ou X Nom Y), <b>ou</b> touchez les bornes sur le plan dans l’ordre. Vérifiez que le contour tombe bien sur le dessin.</div>
  <textarea id="scB" rows="3" placeholder="# Titre 12345/30&#10;464899.42 B1 468376.61&#10;…">${(SCN.btxt||'').replace(/</g,'&lt;')}</textarea>
  <div class="row"><button id="scBpaste">Placer le tableau</button><button id="scUndo">↶ Annuler</button><span style="flex:1"></span><button id="scPrev">Retour</button><button id="scNext" class="on">Suivant</button></div>
  <div class="row"><span class="hint">Touchez le plan pour :</span><button data-lm="b" class="${SCN.lmode==='b'?'on':''}">Bornes</button><button data-lm="water" class="${SCN.lmode==='water'?'on':''}">Tracer un oued</button><button data-lm="road" class="${SCN.lmode==='road'?'on':''}">Tracer une piste</button>${SCN.curLine?'<button id="scEndL">✓ Terminer la ligne</button>':''}</div>
  ${SCN.lines.length?`<div class="res">${SCN.lines.map(l=>`${l.type==='water'?'💧':'🛣️'} ${l.name} (${l.pts.length} pts)`).join(' · ')}</div>`:''}
  <div class="res">${SCN.parcels.map(P=>`${P.name} : <b>${P.pts.length}</b> bornes${P.pts.length>2?' · '+bdS(haF(pArea(P.pts.map(v=>[v[1],v[2]])))):''}`).join(' · ')||'Aucune borne.'}</div><div id="scWarn" class="res"></div>`;
 if(SCN.step===4)h=`<div class="hint">Touchez chaque point coté (le petit point à côté du chiffre) et saisissez l’altitude. Plus il y a de points (surtout à l’intérieur de la parcelle), plus le relief est juste.</div>
  <div class="res"><b>${SCN.spots.length}</b> points cotés${SCN.spots.length?` · de ${bdS(Math.min(...SCN.spots.map(s=>s.Z)).toFixed(1))} à ${bdS(Math.max(...SCN.spots.map(s=>s.Z)).toFixed(1))} m`:''}</div>
  <div class="grid2"><div><label class="lab">Nom du projet</label><input id="scName" class="txt" value="${(q('#impName').value||'').replace(/"/g,'&quot;')}"></div><div><label class="lab">Système</label><select id="scProj" class="txt">${q('#impProj').innerHTML}</select></div></div>
  <div class="row"><button id="scUndo">↶ Annuler</button><button id="scPrev">Retour</button><span style="flex:1"></span><button id="scGo" class="on">Construire la 3D</button></div><div id="scMsg" class="res"></div>`;
 scPanel.innerHTML=h;
 const on=(id,f)=>{const e=scPanel.querySelector('#'+id);if(e)e.onclick=f;};
 const f=scPanel.querySelector('#scFile');if(f)f.onchange=e=>e.target.files[0]&&scLoad(e.target.files[0]);on('scCam',()=>q('#camIn').click());
 on('scNext',()=>{SCN.step++;scPanelRender();});on('scPrev',()=>{SCN.step--;scPanelRender();});
 on('scUndo',()=>{if(!q('#scPop').hidden){q('#pNo').click();return;}if(SCN.step===3&&SCN.lmode!=='b'&&SCN.lines.length){const L=SCN.curLine||SCN.lines.at(-1);L.pts.pop();if(!L.pts.length){SCN.lines.splice(SCN.lines.indexOf(L),1);SCN.curLine=null;}scPanelRender();scRender();return;}if((SCN.step===2&&!SCN.cal.length)||(SCN.step===3&&!SCN.parcels.length)||(SCN.step===4&&!SCN.spots.length)){toastS('Rien à annuler');return;}if(SCN.step===2){SCN.cal.pop();SCN.T=solveCal(SCN.cal);}else if(SCN.step===3){const P=SCN.parcels.at(-1);if(P){if(P.fromPaste)SCN.parcels.pop();else{P.pts.pop();if(!P.pts.length)SCN.parcels.pop();}}}else if(SCN.step===4)SCN.spots.pop();scPanelRender();scRender();});
 scPanel.querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>{SCN.lmode=b.dataset.lm;SCN.curLine=null;scPanelRender();});
 on('scEndL',async()=>{const L=SCN.curLine;SCN.curLine=null;if(L&&L.pts.length<2){SCN.lines.pop();toastS('Ligne trop courte');}else if(L){const v=await ask([{l:'Nom',v:L.name,t:'text'}],'Nom de la ligne (ex. Oued Mazar, Piste…)');if(v&&v[0])L.name=v[0];}scPanelRender();scRender();});
 on('scBpaste',()=>{SCN.btxt=scPanel.querySelector('#scB').value;const ps=parseBornes(SCN.btxt);if(!ps.length){toastS('Aucune borne reconnue');return;}ps.forEach(p=>p.fromPaste=true);SCN.parcels=SCN.parcels.filter(p=>!p.fromPaste).concat(ps);scPanelRender();scFocus();});
 if(SCN.step===4){const sp=scPanel.querySelector('#scProj');sp.value=q('#impProj').value;}
 on('scGo',async()=>{const m=scPanel.querySelector('#scMsg');m.textContent='Construction…';
  try{const name=scPanel.querySelector('#scName').value,proj=scPanel.querySelector('#scProj').value;q('#impName').value=name;q('#impProj').value=proj;
   const parcels=SCN.parcels.filter(p=>p.pts.length>=3).map(p=>({name:SCN.parcels.length===1&&/^Parcelle \d$/.test(p.name)&&name?name:p.name,pts:p.pts}));
   const d=await buildData({name,parcels,spots:SCN.spots.map(s=>[s.X,s.Y,s.Z]),proj,srcNote:'plan scanné, saisie manuelle'});
   // drape the plan image on the terrain
   const W=Math.min(2048,Math.round((d.nx-1)*d.step*4)),H=Math.round(W*(d.ny-1)/(d.nx-1));const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,W,H);
   const x0=d.x0,y1=d.y0+(d.ny-1)*d.step,sx=W/((d.nx-1)*d.step),sy=H/((d.ny-1)*d.step),T=SCN.T;
   if(!T.proj){c.setTransform(T.a*sx,-T.d*sy,T.b*sx,-T.e*sy,(T.c-x0)*sx,(y1-T.f)*sy);c.drawImage(SCN.img,0,0);}
   else{const src=document.createElement('canvas');src.width=SCN.W;src.height=SCN.H;const sctx=src.getContext('2d');sctx.drawImage(SCN.img,0,0);const sd=sctx.getImageData(0,0,SCN.W,SCN.H).data;
    const out=c.createImageData(W,H),od=out.data;for(let v=0;v<H;v++){const Y=y1-v/sy;for(let u=0;u<W;u++){const X=x0+u/sx;const [px,py]=T.inv(X,Y);const i=(v*W+u)*4;
     const ix=px|0,iy=py|0;if(ix>=0&&iy>=0&&ix<SCN.W&&iy<SCN.H){const k=(iy*SCN.W+ix)*4;od[i]=sd[k];od[i+1]=sd[k+1];od[i+2]=sd[k+2];}else{od[i]=od[i+1]=od[i+2]=255;}od[i+3]=255;}}
    c.putImageData(out,0,0);}
   d.subtitle+=' · plan scanné';if(SCN.lines.length)d.lines=SCN.lines.filter(l=>l.pts.length>1).map(l=>({type:l.type,name:l.name,pts:l.pts}));
   const planURL=cv.toDataURL('image/jpeg',0.85);const en=await enrich(d,proj,t=>m.textContent=t);
   RUN.dispose();RUN=main(d,en.sat?[{label:'Image satellite',url:en.sat},{label:'Plan drapé',url:planURL}]:[{label:'Plan drapé',url:planURL}]);scan.hidden=true;
   try{localStorage.setItem('topo3d_last',JSON.stringify(d));}catch(e){}
  }catch(err){m.innerHTML=`<span class="err">${err.message}</span>`;console.error(err);}});}
scPanelRender();
window.__scan={SCN,scTap,scLoad,scPanelRender,solveCal};


</script>
